<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; manifest-src 'self'; worker-src 'self'">
<meta name="theme-color" content="#0B1426">
<title>Och · CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Och CRM">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1426'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23C9A84C'%3EO%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B1426;--bg2:#101b33;--panel:#152040;--panel2:#1b2a50;--line:rgba(201,168,76,.14);--line2:rgba(138,149,171,.18);
  --ink:#F5F0E8;--ink2:#D4CCBC;--muted:#8A95AB;--gold:#C9A84C;--gold2:#E2C97A;--goldsoft:rgba(201,168,76,.12);
  --ok:#5fb98a;--warn:#e0a83c;--bad:#e06a5f;--shadow:0 20px 60px rgba(0,0,0,.45);
  --serif:'Cormorant Garant','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F0E8;--bg2:#efe8dc;--panel:#fffdf9;--panel2:#f6f0e4;--line:rgba(140,110,40,.2);--line2:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#26324d;--muted:#5f6a80;--gold:#9a7a22;--gold2:#7d6318;--goldsoft:rgba(154,122,34,.1);
  --ok:#2f8a5c;--warn:#a86f0c;--bad:#b9443a;--shadow:0 20px 50px rgba(11,20,38,.15);color-scheme:light;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){
  --bg:#F5F0E8;--bg2:#efe8dc;--panel:#fffdf9;--panel2:#f6f0e4;--line:rgba(140,110,40,.2);--line2:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#26324d;--muted:#5f6a80;--gold:#9a7a22;--gold2:#7d6318;--goldsoft:rgba(154,122,34,.1);
  --ok:#2f8a5c;--warn:#a86f0c;--bad:#b9443a;--shadow:0 20px 50px rgba(11,20,38,.15);color-scheme:light}}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Lock screen ---------- */
#lock{position:fixed;inset:0;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));z-index:50;
  background:radial-gradient(ellipse 70% 60% at 80% 20%,var(--goldsoft),transparent 60%),var(--bg)}
#lock .card{margin:auto;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 30px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--goldsoft);border:1px solid var(--line);color:var(--gold);font-family:var(--serif);font-size:24px}
.brand h1{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:.02em}
#lock p.lead{margin:18px 0 22px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pwwrap{position:relative;display:block}
.pwwrap .input{padding-right:46px}
.pwwrap .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.pwwrap .eye:hover{color:var(--gold2)}
.input,select.input,textarea.input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--gold)}
textarea.input{resize:vertical;min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:9px 14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.primary{background:var(--gold);color:#0B1426;border-color:var(--gold);font-weight:500}
.btn.primary:hover{background:var(--gold2);color:#0B1426}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--goldsoft);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:8px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.meter{height:4px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:all .3s}
.err{color:var(--bad);font-size:13px;min-height:20px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
aside.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;gap:4px}
aside .brand{padding:0 8px 22px}
aside .brand h1{font-size:22px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--goldsoft)}
.nav button.on{background:var(--goldsoft);color:var(--gold2)}
.nav button .count{margin-left:auto;font-size:12px;color:var(--muted)}
aside .spacer{flex:1}
main{overflow:auto;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:18px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{font-family:var(--serif);font-weight:500;font-size:28px;flex:1;line-height:1.1}
.searchbtn{display:flex;align-items:center;gap:10px;min-width:220px;color:var(--muted);justify-content:flex-start}
.searchbtn kbd{margin-left:auto;font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.view{padding:26px 28px 120px;max-width:1280px}
.bottomnav{display:none}
#syncBtn{position:relative}
#syncBtn .sdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:transparent}
#syncBtn.dirty .sdot{background:var(--warn)}
#syncBtn.ok .sdot{background:var(--ok)}
#syncBtn.err .sdot{background:var(--bad)}
#syncBtn.busy svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top{padding-top:calc(18px + env(safe-area-inset-top))}
#drawer .pane{padding-top:env(safe-area-inset-top)}

/* ---------- Cards & lists ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .btn{margin-left:auto;font-family:var(--sans)}
.kpi .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--serif);font-size:38px;line-height:1.1;margin-top:6px}
.kpi .sub{font-size:13px;color:var(--muted)}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--goldsoft)}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);padding:18px 8px;text-align:center;font-size:14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--serif);font-size:17px;color:#0B1426;object-fit:cover;overflow:hidden}
.av.lg{width:84px;height:84px;font-size:34px}
.av.sq{border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.gold{border-color:var(--line);color:var(--gold2);background:var(--goldsoft)}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chip.bad{color:var(--bad);border-color:currentColor}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .input{width:auto;min-width:150px}
.toolbar .grow{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{flex:none}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--goldsoft);color:var(--gold2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.ccard:hover{border-color:var(--gold);transform:translateY(-2px)}
.ccard.picked{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);background:var(--goldsoft)}
table.list tr.picked td{background:var(--goldsoft)}
.bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;position:sticky;top:76px;z-index:4}
.ccard .hd{display:flex;gap:12px;align-items:center}
.ccard .nm{font-weight:500}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
table.list td{padding:10px 8px;border-bottom:1px solid var(--line2)}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--goldsoft)}

/* ---------- Drawer (detail) ---------- */
#drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(5,10,20,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#drawer.open{opacity:1;pointer-events:auto}
#drawer .pane{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);overflow:auto;transform:translateX(30px);transition:transform .25s;box-shadow:var(--shadow)}
#drawer.open .pane{transform:none}
.dhead{display:flex;gap:18px;align-items:center;padding:26px 26px 18px;background:linear-gradient(180deg,var(--goldsoft),transparent)}
.dhead h2{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1}
.dclose{position:sticky;top:0;display:flex;justify-content:flex-end;gap:6px;padding:12px 16px 0;z-index:2}
.dbody{padding:0 26px 60px;display:flex;flex-direction:column;gap:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
dl.facts{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{word-break:break-word}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl{position:relative;padding:0 0 18px}
.tl .dot{position:absolute;left:-26px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--panel);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.tl .dot svg{width:10px;height:10px}
.tl .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .txt{white-space:pre-wrap;margin-top:4px;word-break:break-word}
.tl .acts{margin-left:auto;display:flex;gap:2px;opacity:.0;transition:opacity .15s}
.tl:hover .acts,.tl:focus-within .acts{opacity:1}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.media.sm{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:6px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{font-size:11px;line-height:1.2;word-break:break-all;max-height:2.4em;overflow:hidden}
.tile .badge{position:absolute;bottom:6px;left:6px;font-size:10px;background:rgba(11,20,38,.75);color:#F5F0E8;padding:1px 6px;border-radius:8px}
.tile:hover{border-color:var(--gold)}
.tile svg.i{width:28px;height:28px}
.dropzone{border:1.5px dashed var(--line2);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:14px;transition:all .15s}
.dropzone.over{border-color:var(--gold);background:var(--goldsoft);color:var(--gold2)}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col.over{border-color:var(--gold);background:var(--goldsoft)}
.col h4{font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col h4 small{color:var(--muted);font-weight:400}
.deal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px;cursor:grab}
.deal:hover{border-color:var(--gold)}
.deal .v{font-family:var(--serif);font-size:20px}
.deal select{margin-top:8px;width:100%;font-size:12px;padding:4px 6px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2)}

/* ---------- Tasks ---------- */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:10px}
.task:hover{background:var(--goldsoft)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--gold);flex:none;cursor:pointer}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .main{flex:1;min-width:0;cursor:pointer}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .bar{fill:var(--gold);transition:opacity .15s}
.chart .bar:hover,.chart .hit:hover+.bar{opacity:.75}
.chart .axis{fill:var(--muted);font-size:13px}
.chart .grid{stroke:var(--line2);stroke-width:1}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s}
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hbar .trk{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0}

/* ---------- Dialog ---------- */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100dvh - 40px);box-shadow:var(--shadow);margin:auto}
dialog::backdrop{background:rgba(5,10,20,.6);backdrop-filter:blur(3px)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
dialog .dh{padding:20px 22px 8px;font-family:var(--serif);font-size:24px;font-weight:500}
dialog .db{padding:8px 22px;overflow:auto}
dialog.wide{width:min(1100px,calc(100% - 24px))}
dialog .df{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line2);margin-top:8px;flex-wrap:wrap}
dialog .df .left{margin-right:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .full{grid-column:1/-1}
#viewer{width:min(1100px,calc(100% - 24px));background:var(--bg)}
#viewer .vb{display:grid;place-items:center;padding:10px;min-height:200px}
#viewer img,#viewer video{max-width:100%;max-height:75dvh;border-radius:10px}
#viewer iframe{width:100%;height:75dvh;border:0;border-radius:10px;background:#fff}
#viewer audio{width:min(520px,100%)}
#palette{width:min(620px,calc(100% - 24px));margin-top:12vh}
#palette .pin{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:18px 20px;font-size:17px}
#palette .res{max-height:55dvh;overflow:auto;padding:8px}
#palette .row.sel{background:var(--goldsoft)}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec .dotr{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:95;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--shadow);font-size:14px}
#updTxt{flex:1 1 220px}
@media (max-width:860px){#updBar{bottom:calc(84px + env(safe-area-inset-bottom));width:calc(100% - 32px)}}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);font-size:14px;animation:tin .2s}
.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.fab{display:none}
.drag-file{outline:2px dashed var(--gold);outline-offset:-8px}
/* Kampagnen */
.checks{display:flex;flex-wrap:wrap;gap:8px}
.tgl{display:inline-flex;align-items:center;padding:5px 12px;border:1px solid var(--line2);border-radius:20px;font-size:13px;cursor:pointer;background:none;color:var(--ink2)}
.tgl.on{background:var(--goldsoft);border-color:var(--gold);color:var(--gold2)}
.tgl.neg.on{background:transparent;border-color:var(--bad);color:var(--bad)}
.rlist{max-height:340px;overflow:auto;border:1px solid var(--line2);border-radius:12px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:14px}
.rrow:last-child{border-bottom:0}
.mailprev{background:#FFFFFF;color:#1D2433;border-radius:12px;padding:22px;border:1px solid var(--line2);overflow:auto;max-height:520px}
.progress{height:8px;border-radius:6px;background:var(--line2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.statline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
details summary{color:var(--ink2)}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside.side{display:none}
  .top{padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .top h2{font-size:24px}

<script>
'use strict';
// Rückkehr aus dem Microsoft-Anmeldefenster: Code an das CRM-Fenster übergeben und sonst nichts tun
(function () {
  const q = new URLSearchParams(location.search), st = q.get('state') || '';
  if (!st.startsWith('och-') || !(q.get('code') || q.get('error'))) return;
  try { localStorage.setItem('och-ms-auth', JSON.stringify({ state: st, code: q.get('code'), error: q.get('error_description') || q.get('error') })); } catch { }
  document.title = 'Anmeldung abgeschlossen';
  document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<p style="font-family:system-ui,sans-serif;padding:32px;font-size:16px">Anmeldung abgeschlossen. Dieses Fenster schließt sich, sonst bitte einfach schließen.</p>'; });
  setTimeout(() => window.close(), 400);
  throw new Error('och-auth-popup');
})();
/* =====================================================================
   Och · CRM — privat, lokal, verschlüsselt.
   Daten: IndexedDB, jeder Datensatz und jede Datei einzeln mit
   AES-256-GCM verschlüsselt. Datenschlüssel (DEK) wird mit einem
   aus der Passphrase per PBKDF2-SHA256 abgeleiteten Schlüssel verpackt.
   ===================================================================== */
const VERSION = '1.8';
const DB_NAME = 'och-crm', DB_VER = 1;
const PBKDF2_ITER = 600000;
const te = new TextEncoder(), td = new TextDecoder();

let db = null, KEY = null;
const R = new Map();           // entschlüsselter Arbeitsspeicher: id -> Objekt
const SNAP = new Map();        // letzter gespeicherter Stand je id (für Feld-Zeitstempel)
const URLS = new Map();        // Datei-id -> objectURL
let SET = null;                // Einstellungen

const DEFAULT_SETTINGS = {
  id:'settings', kind:'settings', autolock:10, theme:'auto',
  stages:['Idee','Erstkontakt','Angebot','Verhandlung','Gewonnen','Verloren'],
  statuses:['Kunde','Familie','Freunde','Geschäftspartner','Dienstleister','Netzwerk','Bekannte'],
  pipeline:false,     // Pipeline und Chancen anzeigen
  view:'cards',
  pipelineKpis:false   // Kacheln „Offene Pipeline“ und „Gewonnen“ in der Übersicht
};
const KINDS = {
  'Notiz':'i-note','Anruf':'i-phone','Treffen':'i-users','E-Mail':'i-mail',
  'Nachricht':'i-msg','Termin':'i-cal','Sprachnotiz':'i-mic','Medien':'i-image'
};

/* ---------------- Helfer ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v; // nur für statische Inhalte!
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
function icon(name, cls = 'i') {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', cls);
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#' + name);
  s.append(u); return s;
}
const uid = () => Date.now().toString(36) + '-' + [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('');
const fmtDate = (t, opt = { day: '2-digit', month: '2-digit', year: 'numeric' }) => t ? new Date(t).toLocaleDateString('de-DE', opt) : '';
const fmtDT = t => t ? new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const fmtEUR = n => (Number(n) || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const DAY = 86400000;
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function rel(t) {
  if (!t) return '';
  const d = Math.round((startOfDay(t) - startOfDay()) / DAY);
  if (d === 0) return 'heute'; if (d === -1) return 'gestern'; if (d === 1) return 'morgen';
  if (d < 0) return d > -30 ? `vor ${-d} Tagen` : d > -365 ? `vor ${Math.round(-d / 30)} Mon.` : `vor ${Math.round(-d / 365 * 10) / 10} J.`;
  return d < 30 ? `in ${d} Tagen` : `in ${Math.round(d / 30)} Mon.`;
}
const norm = s => (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function toast(msg, bad) {
  const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status' }, msg);
  $('#toasts').append(t); setTimeout(() => t.remove(), 3200);
}
function hue(str) { let x = 0; for (const c of str || '?') x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; }
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function download(name, data, type) {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

/* ---------------- IndexedDB ---------------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('rec')) d.createObjectStore('rec', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('blob')) d.createObjectStore('blob', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
  });
}
const metaGet = k => tx('meta', 'readonly', s => s.get(k));
const metaPut = (k, v) => tx('meta', 'readwrite', s => s.put(v, k));

/* ---------------- Krypto ---------------- */
async function kek(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base,
    { name: 'AES-KW', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
async function createVault(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const dek = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const k = await kek(pass, salt, PBKDF2_ITER);
  const wrapped = await crypto.subtle.wrapKey('raw', dek, k, 'AES-KW');
  await metaPut('vault', { v: 1, salt, iter: PBKDF2_ITER, wrapped, created: Date.now() });
  return crypto.subtle.unwrapKey('raw', wrapped, k, 'AES-KW', 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function openVault(pass, extractable = false) {

async function save(obj, silent) {

  }
  const { iv, ct } = await encrypt(te.encode(JSON.stringify(obj)));
  await tx('rec', 'readwrite', s => s.put({ id: obj.id, iv, ct }));
  R.set(obj.id, obj); SNAP.set(obj.id, JSON.stringify(obj));

function parseDates(text) {
  const ok = [], bad = [];

    const m = line.match(/^(.+?):\s*(\d{1,2})\.(\d{1,2})\.(\d{4})?$/);

  const mo = +iso.slice(5, 7), d = +iso.slice(8, 10); if (!mo || !d) return null;
  const today = startOfDay(); const y = new Date().getFullYear();
  let t = new Date(y, mo - 1, d).getTime(); if (t < today) t = new Date(y + 1, mo - 1, d).getTime();

async function storeFile(file, link = {}) {
  const id = uid();
  const buf = await file.arrayBuffer();
  const { iv, ct } = await encrypt(buf);
  await tx('blob', 'readwrite', s => s.put({ id, iv, ct }));
  let thumb = null;
  if (/^image\//.test(file.type)) thumb = await makeThumb(file).catch(() => null);
  else if (/^video\//.test(file.type)) thumb = await videoThumb(file).catch(() => null);
  if (thumb) {
    const t = await encrypt(await thumb.arrayBuffer());
    await tx('blob', 'readwrite', s => s.put({ id: id + ':t', iv: t.iv, ct: t.ct }));
  }
  return save({ id, kind: 'file', name: file.name || 'Datei', type: file.type || 'application/octet-stream', size: file.size, thumb: !!thumb, ...link });
}
async function fileURL(id, thumb) {
  const key = thumb ? id + ':t' : id;
  if (URLS.has(key)) return URLS.get(key);
  const row = await tx('blob', 'readonly', s => s.get(key));
  if (!row) return null;
  const meta = get(id);
  const blob = new Blob([await decrypt(row.iv, row.ct)], { type: thumb ? 'image/jpeg' : (meta?.type || '') });
  const url = URL.createObjectURL(blob); URLS.set(key, url); return url;
}
async function fileBlob(id) {
  const row = await tx('blob', 'readonly', s => s.get(id));

}
async function delBlob(id) {
  await tx('blob', 'readwrite', s => { s.delete(id + ':t'); return s.delete(id); });
  for (const k of [id, id + ':t']) if (URLS.has(k)) { URL.revokeObjectURL(URLS.get(k)); URLS.delete(k); }
}

function makeThumb(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const m = 360, sc = Math.min(1, m / Math.max(img.width, img.height));
      const c = h('canvas', { width: Math.round(img.width * sc), height: Math.round(img.height * sc) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .8);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); }; img.src = u;
  });
}
function videoThumb(file) {
  return new Promise((res, rej) => {
    const v = document.createElement('video'); const u = URL.createObjectURL(file);
    v.muted = true; v.preload = 'metadata'; v.src = u;
    const to = setTimeout(() => { URL.revokeObjectURL(u); rej(); }, 5000);
    v.onloadeddata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = () => {
      const m = 360, sc = Math.min(1, m / Math.max(v.videoWidth, v.videoHeight));
      const c = h('canvas', { width: Math.round(v.videoWidth * sc), height: Math.round(v.videoHeight * sc) });
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      clearTimeout(to); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .8);
    };
    v.onerror = () => { clearTimeout(to); URL.revokeObjectURL(u); rej(); };
  });
}

  if (/^(.)\1+$/.test(p) || /^(passwort|password|12345|qwertz|qwerty)/i.test(p)) s = 0;
  return Math.min(5, s);
}

function weekChart(acts) {

    const r = n ? mk('path', { class: 'bar', d: `M${x},${H} V${H - bh + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${H} Z` }) : mk('rect', { x, y: H - 1, width: w, height: 1, class: 'bar', opacity: .3 });
    [hit, r].forEach(el => { el.addEventListener('mousemove', ev => tip(ev, label)); el.addEventListener('mouseleave', untip); });

  const iv = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 250);

function openPalette() {
  const p = $('#palette'); let sel = 0, items = [];
  const input = h('input', { class: 'input pin', placeholder: 'Suche nach Kontakten, Notizen, Aufgaben, Dateien … oder Befehl', 'aria-label': 'Suche' });
  const res = h('div', { class: 'res' });
  const cmds = [
    ['Neuer Kontakt', 'i-user', () => editContact()], ['Neue Aufgabe', 'i-tasks', () => editTask()], ...(SET.pipeline ? [['Neue Verkaufschance', 'i-euro', () => editDeal()]] : []), ['Neue Rundmail', 'i-mail', () => newCampaign()],
    ['Backup erstellen', 'i-shield', () => exportBackup()], ['Sperren', 'i-lock', lockClick], ...visibleViews().map(v => ['Gehe zu ' + v.label, v.icon, () => go(v.id)])];
  const run = () => {
    const q = norm(input.value).split(/\s+/).filter(Boolean); items = [];
    const m = t => q.every(w => t.includes(w));
    if (!q.length) items = cmds.map(([l, i, f]) => ({ l, i, s: 'Befehl', f }));
    else {
      contacts().forEach(c => m(searchText(c)) && items.push({ l: cname(c), s: [c.role, companyName(c), c.status].filter(Boolean).join(' · ') || 'Kontakt', c, f: () => openDetail(c.id) }));
      all('activity').forEach(a => { const c = get(a.contactId); c && m(norm(a.text + ' ' + a.type)) && items.push({ l: (a.text || a.type).slice(0, 80), s: `${a.type} · ${cname(c)} · ${fmtDate(a.date)}`, i: KINDS[a.type], f: () => openDetail(c.id) }); });
      all('task').forEach(t => m(norm(t.title + ' ' + t.note)) && items.push({ l: t.title, s: 'Aufgabe' + (t.done ? ' · erledigt' : ''), i: 'i-tasks', f: () => editTask(t) }));
      if (SET.pipeline) all('deal').forEach(d => m(norm(d.title + ' ' + d.product + ' ' + d.note)) && items.push({ l: d.title, s: `Chance · ${d.stage} · ${fmtEUR(d.value)}`, i: 'i-euro', f: () => editDeal(d) }));
      all('file').forEach(f => m(norm(f.name)) && items.push({ l: f.name, s: 'Datei · ' + fmtSize(f.size), i: FICON[ftype(f.type)], f: () => viewFile(f.id) }));
      cmds.forEach(([l, i, f]) => m(norm(l)) && items.push({ l, i, s: 'Befehl', f }));
      items = items.slice(0, 40);
    }
    sel = Math.min(sel, Math.max(0, items.length - 1));
    res.replaceChildren(...(items.length ? items.map((it, k) => h('div', { class: 'row' + (k === sel ? ' sel' : ''), onclick: () => pick(k), onmousemove: () => { if (sel !== k) { sel = k; run(); } } }, it.c ? avatar(it.c) : h('div', { class: 'av', style: 'background:var(--goldsoft);color:var(--gold)' }, icon(it.i || 'i-note')), h('div', { class: 'main' }, h('div', { class: 't' }, it.l), h('div', { class: 's' }, it.s)))) : [h('div', { class: 'empty' }, 'Nichts gefunden.')]));
    res.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  };
  const pick = k => { const it = items[k]; if (!it) return; p.close(); it.f(); };
  input.addEventListener('input', () => { sel = 0; run(); });
  input.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); run(); } else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); run(); } else if (e.key === 'Enter') { e.preventDefault(); pick(sel); } });
  p.replaceChildren(input, res); p.showModal(); input.focus(); run();
  p.onclick = e => { if (e.target === p) p.close(); };
}

    fld('Neue Passphrase (mind. 12 Zeichen)', pwIn('n1', 'new-password', 12)),
    fld('Neue Passphrase wiederholen', pwIn('n2', 'new-password', 12)),

    const wrapped = await crypto.subtle.wrapKey('raw', dek, k, 'AES-KW');

async function restoreBackup() {

      if (td.decode(await file.slice(0, 8).arrayBuffer()) === 'OCHSYNC1') {
        sf = await readSyncHeader(file);
        data = { created: sf.header.created, vault: sf.header.vault, rec: sf.header.rec, blob: sf.header.blob.filter(b => !b.id.endsWith(':t')), from: sf.header.device?.name };
      } else data = JSON.parse(await file.text());
    } catch { return toast('Keine gültige Backup- oder Sync-Datei.', true); }
    if (!sf && data.format !== 'och-crm-backup') return toast('Keine gültige Backup- oder Sync-Datei.', true);
    const pw = inp('pw', '', { type: 'password', required: true, autocomplete: 'off' });
    const content = h('div', null, h('p', { style: 'margin-bottom:12px' }, `${sf ? `Sync-Datei von „${data.from || 'Gerät'}“` : 'Backup'} vom ${fmtDT(data.created)} mit ${data.rec.length} Datensätzen und ${data.blob.length} Dateien.`),
      h('p', { class: 'chip bad', style: 'margin-bottom:12px;white-space:normal' }, 'Achtung: Der aktuelle Inhalt dieses CRM wird vollständig ersetzt.'),
      fld('Passphrase des Backups', pw));
    const f = await dialog('Backup einspielen', content, 'Einspielen'); if (!f) return;
    try {
      const salt = unb64(data.vault.salt), wrapped = unb64(data.vault.wrapped);
      const k = await kek(pw.value, salt, data.vault.iter);
      const testKey = await crypto.subtle.unwrapKey('raw', wrapped, k, 'AES-KW', 'AES-GCM', false, ['decrypt']);
      if (data.rec[0]) await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(data.rec[0].iv) }, testKey, unb64(data.rec[0].ct));
      if (!db) db = await idbOpen();
      await tx('rec', 'readwrite', s => s.clear()); await tx('blob', 'readwrite', s => s.clear());
      await metaPut('vault', { v: data.vault.v, iter: data.vault.iter, salt, wrapped, restored: Date.now() });
      const de = r => ({ id: r.id, iv: unb64(r.iv), ct: unb64(r.ct).buffer });
      await tx('rec', 'readwrite', s => { data.rec.forEach(r => s.put(de(r))); });
      if (sf) for (const ix of sf.header.blob) { const ct = await sf.blob(ix); await tx('blob', 'readwrite', s => s.put({ id: ix.id, iv: unb64(ix.iv), ct })); }
      else for (let i = 0; i < data.blob.length; i += 20) await tx('blob', 'readwrite', s => { data.blob.slice(i, i + 20).forEach(r => s.put(de(r))); });

      setTimeout(() => location.reload(), 1200);
    } catch (e) { console.warn(e); toast('Passphrase falsch oder Backup beschädigt.', true); }
  };

}

function parseVCF(text) {

    const i = line.indexOf(':'); if (i < 0) continue;
    const head = line.slice(0, i), val = line.slice(i + 1); const key = head.split(';')[0].replace(/^item\d+\./i, '').toUpperCase();
    if (key === 'BEGIN') c = { kind: 'contact', type: 'person', emails: [], phones: [], tags: [] };
    else if (!c) continue;
    else if (key === 'END') { if (c.firstName || c.lastName || c.company) out.push(c); c = null; }
    else if (key === 'N') { const [ln, fn] = val.split(';'); c.lastName = un(ln); c.firstName = un(fn); }
    else if (key === 'FN' && !c.firstName && !c.lastName) { const p = un(val).split(' '); c.lastName = p.pop(); c.firstName = p.join(' '); }
    else if (key === 'ORG') c.company = un(val.split(';')[0]);

function briefanrede(c) {

  if (c.salutation === 'Frau' && c.lastName) return 'Sehr geehrte Frau ' + c.lastName;

  if (header.format !== 'och-crm-sync') throw new Error('format');
  return { header, blob: ix => file.slice(base + ix.off, base + ix.off + ix.len).arrayBuffer() };
}
const tstamp = o => o.updatedAt || o.createdAt || o.deletedAt || 0;
const LOCAL_SETTINGS = ['theme', 'autolock', 'view', 'lastBackup'];
async function putRaw(r, o) { await tx('rec', 'readwrite', s => s.put({ id: r.id, iv: unb64(r.iv), ct: unb64(r.ct).buffer })); R.set(o.id, o); SNAP.set(o.id, JSON.stringify(o)); }
// Feldgenau zusammenführen: pro Feld gewinnt die jüngere Änderung
function fieldMerge(l, o) {
  const m = Object.assign({}, l, { _ft: Object.assign({}, l._ft) });
  for (const k of new Set([...Object.keys(l), ...Object.keys(o)])) {
    if (['_ft', 'updatedAt', 'createdAt', 'id'].includes(k)) continue;
    const to = o._ft?.[k] ?? o.updatedAt ?? 0, tl = l._ft?.[k] ?? l.updatedAt ?? 0;
    if (to > tl) { if (k in o) m[k] = o[k]; else delete m[k]; m._ft[k] = to; }
  }
  m.updatedAt = Math.max(l.updatedAt || 0, o.updatedAt || 0);
  return m;
}
async function mergeSync(sf) {
  const H = sf.header;
  if (H.device?.id === DEV.id) return { n: 0, nb: 0 };
  try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(H.check.iv) }, KEY, unb64(H.check.ct)); } catch { throw new Error('foreign'); }
  const objs = [];
  for (const r of H.rec) objs.push([r, JSON.parse(td.decode(await decrypt(unb64(r.iv), unb64(r.ct))))]);
  let n = 0, nb = 0;
  for (const [r, o] of objs.filter(x => x[1].kind === 'tomb')) {
    const t = R.get(o.target);
    if (t && tstamp(t) <= o.deletedAt) { if (t.kind === 'file') await delBlob(t.id); await tx('rec', 'readwrite', s => s.delete(t.id)); R.delete(t.id); n++; }
    if (!R.has(o.id)) await putRaw(r, o);
  }
  for (const [r, o] of objs.filter(x => x[1].kind !== 'tomb')) {
    const tomb = R.get('t~' + o.id); if (tomb && tomb.deletedAt >= tstamp(o)) continue;
    const l = R.get(o.id);
    if (!l) { await putRaw(r, o); n++; continue; }
    const m = fieldMerge(l, o);
    if (o.id === 'settings') for (const k of LOCAL_SETTINGS) if (k in l) m[k] = l[k];
    if (JSON.stringify(m) === JSON.stringify(l)) continue;
    await save(m, true); n++;
    if (o.id === 'settings') SET = Object.assign({}, DEFAULT_SETTINGS, m);
  }
  const have = new Set(await tx('blob', 'readonly', s => s.getAllKeys()));
  for (const ix of H.blob) {
    if (have.has(ix.id) || !R.has(ix.id.replace(/:t$/, ''))) continue;
    const ct = await sf.blob(ix); await tx('blob', 'readwrite', s => s.put({ id: ix.id, iv: unb64(ix.iv), ct })); nb++;
  }
  if (n || nb) dirty = true;
  return { n, nb };
}
const dirHandle = () => metaGet('syncDir');
async function folderOK(hd, ask) { const o = { mode: 'readwrite' }; if (await hd.queryPermission(o) === 'granted') return true; return ask ? (await hd.requestPermission(o)) === 'granted' : false; }
async function chooseFolder() {
  try { const hd = await showDirectoryPicker({ id: 'och-crm-sync', mode: 'readwrite' }); await metaPut('syncDir', hd); toast('Sync-Ordner: ' + (hd.name || 'gewählt')); await syncNow(true); if (current === 'settings') render(); }
  catch (e) { if (e.name !== 'AbortError') toast('Ordner konnte nicht gewählt werden.', true); }
}
async function syncNow(ask, quiet) {
  if (syncing || !KEY || !DEV) return;
  const hd = FS_OK ? await dirHandle() : null;
  if (!hd) { if (!quiet) manualSync(); return; }
  if (!await folderOK(hd, ask)) { setSyncState('Ordner-Freigabe nötig. Auf das Sync-Symbol tippen.'); return; }
  syncing = true; setSyncState();
  try {
    let n = 0, nb = 0;
    for await (const [name, entry] of hd.entries()) {
      if (entry.kind !== 'file' || !name.endsWith('.ochsync') || name === DEV.file) continue;
      const f = await entry.getFile(); const seen = DEV.seen[name];
      if (seen && seen.lastModified === f.lastModified && seen.size === f.size) continue;
      try { const sf = await readSyncHeader(f); const r = await mergeSync(sf); n += r.n; nb += r.nb; DEV.seen[name] = { name: sf.header.device?.name, created: sf.header.created, lastModified: f.lastModified, size: f.size }; }
      catch (e) { console.warn(name, e); if (e.message === 'foreign' && !quiet) toast(`„${name}“ gehört zu einem anderen CRM und wird ignoriert.`, true); }
    }
    let exists = true; try { await hd.getFileHandle(DEV.file); } catch { exists = false; }
    if (dirty || !exists) {
      dirty = false;
      try { const file = await buildSyncFile(); const fh = await hd.getFileHandle(DEV.file, { create: true }); const w = await fh.createWritable(); await w.write(file); await w.close(); }
      catch (e) { dirty = true; throw e; }
    }
    DEV.lastSync = Date.now(); await saveDevice();
    syncing = false; setSyncState();
    if (n || nb) { refresh(); toast(`Sync: ${n} Änderung${n === 1 ? '' : 'en'}, ${nb} Datei${nb === 1 ? '' : 'en'} übernommen`); } else if (!quiet) toast('Alles synchron ✓');
  } catch (e) { console.warn(e); syncing = false; setSyncState('Fehler: ' + e.message); if (!quiet) toast('Sync fehlgeschlagen: ' + e.message, true); }
  finally { syncing = false; }
}
async function autoSync() { if (!KEY || !DEV || !FS_OK) return; const hd = await dirHandle(); if (hd && await folderOK(hd, false)) syncNow(false, true); else setSyncState(); }
setInterval(autoSync, 90000);
document.addEventListener('visibilitychange', () => { if (KEY && DEV && (document.hidden ? dirty : true)) autoSync(); });
$('#syncBtn').onclick = () => syncNow(true);

async function manualSync() {
  const status = h('p', { class: 'muted', style: 'font-size:14px;min-height:22px;margin-top:12px' });
  let own = null;
  const shareLbl = h('span', null, 'Wird vorbereitet …');
  const shareBtn = h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: async () => {
    let done = false;
    if (navigator.canShare?.({ files: [own] })) { try { await navigator.share({ files: [own], title: 'Och · CRM Sync' }); done = true; } catch (e) { if (e.name !== 'AbortError') { download(own.name, own); done = true; } } }
    else { download(own.name, own); done = true; }
    if (done) { dirty = false; DEV.lastSync = Date.now(); await saveDevice(); setSyncState(); status.textContent = 'Lege die Datei im Sync-Ordner ab und ersetze die alte Version.'; }
  } }, icon('i-upload'), shareLbl);
  const prep = async () => { shareBtn.disabled = true; own = await buildSyncFile(); shareBtn.disabled = false; shareLbl.textContent = `2 · Meinen Stand sichern (${fmtSize(own.size)})`; };
  const loadBtn = h('button', { class: 'btn', type: 'button', onclick: () => {
    const i = $('#fileIn'); i.value = ''; i.accept = ''; i.multiple = true; i.removeAttribute('capture');
    i.onchange = async () => {
      let n = 0, nb = 0, k = 0; status.textContent = 'Wird zusammengeführt …';
      for (const f of i.files) {
        if (f.name === DEV.file) continue;
        try { const sf = await readSyncHeader(f); const r = await mergeSync(sf); n += r.n; nb += r.nb; k++; DEV.seen[f.name] = { name: sf.header.device?.name, created: sf.header.created }; }
        catch (e) { status.textContent = e.message === 'foreign' ? `„${f.name}“ gehört zu einem anderen CRM.` : `„${f.name}“ ist keine Sync-Datei.`; return; }
      }
      DEV.lastSync = Date.now(); await saveDevice(); setSyncState(); refresh();
      status.textContent = `✓ ${k} Gerät${k === 1 ? '' : 'e'} gelesen: ${n} Änderung${n === 1 ? '' : 'en'}, ${nb} Datei${nb === 1 ? '' : 'en'} übernommen.`;
      prep();
    };
    i.click();
  } }, icon('i-download'), '1 · Stand der anderen Geräte laden');
  prep();
  await dialog('Synchronisieren', h('div', null,
    h('p', { style: 'font-size:14px' }, 'Öffne deinen Sync-Ordner (z. B. OneDrive › OCH-CRM) und wähle die Dateien der anderen Geräte. Danach sicherst du den Stand dieses Geräts dort als ', h('strong', null, DEV.file), '.'),
    h('div', { class: 'quick', style: 'margin-top:14px' }, loadBtn, shareBtn), status), null);
}
function syncCard(card, btns) {
  const name = inp('dev', DEV?.name || '', { autocomplete: 'off' });
  name.addEventListener('change', async () => { if (name.value.trim()) { DEV.name = name.value.trim(); await saveDevice(); toast('Gerätename gespeichert'); } });
  const folder = h('span', { class: 'muted' }, FS_OK ? 'nicht gewählt' : 'manuell (Browser erlaubt keinen Ordnerzugriff)');
  const actions = btns();
  const seen = Object.values(DEV?.seen || {});
  if (FS_OK) dirHandle().then(hd => {
    if (hd) { folder.textContent = (hd.name || 'gewählt') + ' · automatisch alle 1–2 Min.'; actions.append(h('button', { class: 'btn primary', onclick: () => syncNow(true) }, icon('i-sync'), 'Jetzt synchronisieren'), h('button', { class: 'btn', onclick: chooseFolder }, 'Ordner ändern')); }
    else actions.append(h('button', { class: 'btn primary', onclick: chooseFolder }, icon('i-sync'), 'Sync-Ordner wählen'));
    actions.append(h('button', { class: 'btn', onclick: manualSync }, 'Manuell'));
  });
  else actions.append(h('button', { class: 'btn primary', onclick: manualSync }, icon('i-sync'), 'Synchronisieren'));
  return card('Synchronisation', 'i-sync',
    h('p', { class: 'muted', style: 'font-size:14px' }, 'Halte Laptop und Handy über einen Cloud-Ordner gleich (empfohlen: OneDrive deines OCH-Kontos, Ordner „OCH-CRM“). Jedes Gerät legt dort eine eigene, verschlüsselte Datei ab. Die Cloud sieht nur Datensalat.'),
    h('div', { style: 'height:12px' }),
    fld('Name dieses Geräts', name),
    h('dl', { class: 'facts' }, h('dt', null, 'Sync-Ordner'), h('dd', null, folder), h('dt', null, 'Eigene Datei'), h('dd', null, DEV?.file || '—'),
      h('dt', null, 'Zuletzt'), h('dd', null, DEV?.lastSync ? `${fmtDT(DEV.lastSync)} (${rel(DEV.lastSync)})` : 'noch nie'),
      h('dt', null, 'Andere Geräte'), h('dd', null, seen.length ? seen.map(x => `${x.name || 'Gerät'} (Stand ${fmtDT(x.created)})`).join(', ') : '—')),
    actions,
    h('p', { class: 'note' }, 'Neues Gerät einrichten: Dort auf dem Startbildschirm „Backup oder Sync-Datei einspielen“ tippen, die Sync-Datei dieses Geräts wählen und deine Passphrase eingeben.'));
}

/* ---------------- Updates erkennen ----------------
   Holt die aktuelle index.html ohne Zwischenspeicher und vergleicht die
   Versionsnummer. Bei jeder Auslieferung wird VERSION erhöht. */
let lastUpdCheck = 0;
const verNum = v => String(v).split('.').map(n => parseInt(n, 10) || 0);
function isNewer(a, b) { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function checkUpdate(manual) {
  if (!KEY) return;
  if (!manual && Date.now() - lastUpdCheck < 5 * 60000) return;
  lastUpdCheck = Date.now();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store', signal: ctl.signal }).finally(() => clearTimeout(to));
    if (!r.ok) throw new Error(r.status);
    const m = (await r.text()).match(/const VERSION = '([^']+)'/);
    const latest = m && m[1];
    if (latest && isNewer(latest, VERSION)) { showUpdate(latest); return latest; }
    if (manual) toast('Du hast die neueste Version (' + VERSION + ').');
  } catch { if (manual) toast('Prüfung nicht möglich. Bist du offline?', true); }
}
function showUpdate(latest) {
  $('#updTxt').textContent = `Neue Version ${latest} verfügbar (du hast ${VERSION}). Danach kurz wieder entsperren.`;
  $('#updBar').classList.remove('hidden');
}
$('#updLater').onclick = () => $('#updBar').classList.add('hidden');
$('#updBtn').onclick = async () => {
  if (RUN && !await confirmBox('Rundmail-Versand läuft', 'Das Neuladen bricht den laufenden Versand ab. Den Rest kannst du danach fortsetzen.', 'Trotzdem neu laden')) return;
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch { }
  location.reload();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(() => checkUpdate(), 30 * 60000);

/* ---------------- App-Installation (PWA) ---------------- */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (KEY && current === 'settings') render(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname)))
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker', e));
function appCard(card, btns) {
  const ios = /iPhone|iPad/.test(navigator.userAgent);
  let body;
  if (isStandalone()) body = h('p', { style: 'font-size:14px' }, '✓ Läuft als installierte App.');
  else if (installEvt) body = btns(h('button', { class: 'btn primary', onclick: async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); } }, icon('i-app'), 'Als App installieren'));
  else if (location.protocol === 'file:') body = h('p', { class: 'muted', style: 'font-size:14px' }, 'Als App installieren geht nur, wenn das CRM über HTTPS geöffnet wird (z. B. GitHub Pages), nicht als lokale Datei.');
  else if (ios) body = h('p', { style: 'font-size:14px' }, 'In Safari unten auf ', h('strong', null, 'Teilen'), ' tippen und dann ', h('strong', null, '„Zum Home-Bildschirm“'), ' wählen.');
  else body = h('p', { class: 'muted', style: 'font-size:14px' }, 'Im Browser-Menü „App installieren“ bzw. „Zum Startbildschirm hinzufügen“ wählen.');
  return card('App', 'i-app', h('p', { class: 'muted', style: 'font-size:14px;margin-bottom:10px' }, 'Installiert startet das CRM wie eine eigene App, ohne Browserleiste und auch offline.'), body,
    ios && !isStandalone() ? h('p', { class: 'note' }, 'Hinweis iPhone: Die installierte App hat einen eigenen Speicher, getrennt von Safari. Richte das CRM nach der Installation in der App ein, z. B. über eine Sync-Datei.') : null);
}

/* ---------------- Start ---------------- */
if (!window.crypto?.subtle || !window.indexedDB) {
  $('#lockLead').textContent = 'Dieser Browser unterstützt keine sichere Verschlüsselung (Web Crypto) oder keinen lokalen Speicher. Bitte die Seite über HTTPS oder als lokale Datei in einem aktuellen Browser öffnen.';
  $('#lockForm').querySelectorAll('input,button').forEach(e => e.disabled = true);
} else initLock().catch(e => { console.error(e); $('#lockErr').textContent = 'Speicher nicht verfügbar (privates Fenster?).'; });
</script>
